<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="RhythmRun — 純粹的跑步記錄與節拍訓練工具" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0D0D0D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>RhythmRun</title>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        // More robust check for generic Script error
        if (msg && msg.toLowerCase().includes('script error')) {
          console.warn('Suppressing generic "Script error" popup. UI is already visible.');
          return; 
        }
        var str = msg;
        if(error) str += '\n' + error.stack;
        alert('Global Error: ' + str);
      };
      window.addEventListener('unhandledrejection', function(e) {
        let msg = (e.reason ? e.reason.message || e.reason : '');
        if (msg && msg.toString().toLowerCase().includes('script error')) return;
        alert('Unhandled Rejection: ' + msg);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
