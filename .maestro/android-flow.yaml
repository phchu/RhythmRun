appId: com.phchu.rhythmrun
---
- launchApp:
    clearState: true
- assertVisible: "Start Run"

# 1. 點擊開始跑步，驗證狀態改變
- tapOn: "Start Run"
- assertVisible: "Pause"
- assertVisible: "0.00"

# 2. 模擬位置更新（確保配速與距離正常反應）
- setLocation:
    latitude: 25.0330
    longitude: 121.5654
- evalScript: "java.lang.Thread.sleep(1000)"

# 3. 模擬電源鍵點擊以鎖定螢幕（驗證 Native 鎖屏 Activity）
- sendKeyPress: Power
- evalScript: "java.lang.Thread.sleep(2000)"
- sendKeyPress: Power

# Android 向上滑動以展開 lock screen
- swipe:
    start: 500, 1800
    end: 500, 500
- evalScript: "java.lang.Thread.sleep(1000)"

# 4. 解鎖並暫停跑步，完成儲存流程
- tapOn: "Pause"
- tapOn: "End"
- assertVisible: "History"
