appId: com.phchu.rhythmrun
---
- launchApp
- assertVisible: "活動"

# 1. 點擊導覽列中的「跑步」分頁
- tapOn: "跑步"
- assertVisible: "Start"

# 2. 點擊「Start」按鈕開始運動
- tapOn: "Start"
- evalScript: "java.lang.Thread.sleep(1000)"

# 3. 模擬退回桌面以觸發 iOS Live Activity
- pressKey: "home"
- evalScript: "java.lang.Thread.sleep(2000)"

# 4. 在 iOS 模擬器中下拉通知中心顯示 Live Activity
- swipe:
    start: 50%,0%
    end: 50%,80%
- evalScript: "java.lang.Thread.sleep(1500)"

# 5. 截圖以視覺化驗證 Live Activity 小工具中的 monospacedDigit 渲染效果
- takeScreenshot: ios-live-activity-verification
